# 注意：不要给这个服务加 TimeoutStartSec！
# 实测（2026-09-20）：上游 open_xdatachannel.py 在建立数据会话后会**常驻**
# （持有 /dev/xmm0/rpc），这个进程就是数据会话本身。给它设 120s 超时会把它杀掉，
# 结果是 wwan0 只剩 IPv6 link-local、没有 IPv4，面板显示 0 信号。
# 因为触发方式已经换成 fibocom-l850-up.timer（脱离启动关键路径），
# 常驻的 oneshot 不会再拖慢启动，所以这里只需要限流即可。
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=4
