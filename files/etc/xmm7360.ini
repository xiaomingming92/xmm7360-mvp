# xmm7360-pci 驱动配置（这台机器：联通 LTE）
apn=3gnet

# 通过 D-Bus 把 wwan0 注册进 NetworkManager（连接名 xmm7360，type=generic）：
# 脚本会写入地址/32 + 网关 + 运营商 DNS，把设备设成 Managed 并 ActivateConnection，
# 于是 GNOME 网络面板/nmcli 里能看到并管理这条连接。
dbus=True

# 不让脚本往 /etc/resolv.conf 追加（Ubuntu 用 systemd-resolved，DNS 已交给 NM 连接）
noresolv=True

# 脚本自身也会加一条默认路由；metric 比 wifi(600) 低，插着 4G 时优先走移动数据。
metric=700

# lte.sh setup 会把 lte 命令软链到这里
BIN_DIR=/usr/local/bin

# 驱动源码目录（install.sh 会写入这里；xmm-up 用它找 rpc/open_xdatachannel.py）。
# 默认值只是占位，正常由 install.sh 按你 clone 的位置覆盖。
SRC=/usr/local/src/xmm7360-mvp/src
